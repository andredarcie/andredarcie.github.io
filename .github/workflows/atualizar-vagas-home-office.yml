name: Atualizar vagas home office

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar e filtrar vagas
        run: node vagas-home-office/atualizar-vagas.mjs
      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vagas-home-office/vagas.js
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza vagas home office"
            git push
          fi
