<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#33481f">
<title>tiny life — ant colony</title>
<meta name="description" content="A 3D ant colony simulation: black specks foraging on bare earth, wearing pheromone trails into the dirt.">
<link rel="stylesheet" href="styles.css?v=9">

<!-- Cache-busting central: cada módulo é mapeado para a sua URL com ?v=N, e os
     imports dentro dos .js vão sem query string. Trocar o N aqui invalida tudo. -->
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.min.js?v=9",
    "./src/main.js": "./src/main.js?v=9",
    "./src/world.js": "./src/world.js?v=9",
    "./src/renderer3d.js": "./src/renderer3d.js?v=9",
    "./src/grass-field.js": "./src/grass-field.js?v=9",
    "./src/camera-rig.js": "./src/camera-rig.js?v=9",
    "./src/hud.js": "./src/hud.js?v=9",
    "./src/telemetry.js": "./src/telemetry.js?v=9",
    "./src/colony.js": "./src/colony.js?v=9",
    "./src/queen.js": "./src/queen.js?v=9",
    "./src/brood.js": "./src/brood.js?v=9",
    "./src/ant.js": "./src/ant.js?v=9",
    "./src/food-source.js": "./src/food-source.js?v=9",
    "./src/pheromone-field.js": "./src/pheromone-field.js?v=9",
    "./src/terrain-shape.js": "./src/terrain-shape.js?v=9",
    "./src/ground.js": "./src/ground.js?v=9",
    "./src/spatial-hash.js": "./src/spatial-hash.js?v=9",
    "./src/config.js": "./src/config.js?v=9",
    "./src/palette.js": "./src/palette.js?v=9",
    "./src/math.js": "./src/math.js?v=9"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="hud hud-top">
  <span class="title">tiny life</span>
  <span class="sub">ant colony</span>
  <span class="build">build 9</span>
</header>

<p class="hud hud-hint" id="hint">tap to scatter food · drag to look around</p>

<div class="hud hud-actions">
  <button id="btn-trails" type="button" aria-pressed="true">trails</button>
  <button id="btn-reset" type="button">reset</button>
</div>

<section class="hud panel" aria-label="Colony status">
  <p class="panel-status" id="stat-status">scouting for food</p>

  <dl class="panel-rows">
    <div class="row"><dt>workers</dt><dd id="stat-workers">0</dd></div>
    <div class="row sub"><dt>foraging</dt><dd id="stat-foraging">0</dd></div>
    <div class="row sub"><dt>hauling</dt><dd id="stat-hauling">0</dd></div>

    <div class="row"><dt>brood</dt><dd id="stat-brood">0</dd></div>
    <div class="row sub"><dt>egg·larva·pupa</dt><dd id="stat-stages">0 · 0 · 0</dd></div>

    <div class="row"><dt>gathered</dt><dd id="stat-gathered">0</dd></div>
    <div class="row sub"><dt>per minute</dt><dd id="stat-rate">0</dd></div>
    <div class="row sub"><dt>food piles</dt><dd id="stat-piles">0</dd></div>
  </dl>

  <canvas id="spark" class="panel-spark" width="132" height="26" aria-hidden="true"></canvas>
</section>

<!-- Módulo ES não carrega de file://. Sem este aviso, abrir o arquivo com dois
     cliques dá tela parada e nenhuma pista do motivo. -->
<script>
  if (location.protocol === 'file:') {
    document.getElementById('hint').textContent =
      'serve this over http:// — es modules do not load from file://';
  }
</script>
<script type="module" src="src/main.js?v=9"></script>
</body>
</html>
