<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #tela { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #carga { position: fixed; inset: auto 0 20px 0; text-align: center; color: #555; font: 12px "Courier New", monospace; }
  #build { position: fixed; right: 6px; bottom: 4px; color: #2a2a2a; font: 10px "Courier New", monospace; pointer-events: none; }

  /* ---- toque (celular/tablet) ---- */
  .pad, #tela-cheia { display: none; }
  body.toque #build { bottom: auto; right: auto; top: calc(4px + env(safe-area-inset-top)); left: calc(6px + env(safe-area-inset-left)); color: #3a3a3a; }
  /* em pé: a tela em cima, os controles embaixo, sem sobrepor */
  body.toque.retrato { padding-bottom: calc(200px + env(safe-area-inset-bottom)); padding-top: env(safe-area-inset-top); }
  body.toque .pad { display: block; position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); touch-action: none; }
  /* deitado: a tela ocupa a altura toda e os controles ficam dos lados */
  body.toque.paisagem .pad { bottom: auto; top: 50%; transform: translateY(-50%) scale(.9); }
  body.toque.paisagem #dpad { left: calc(8px + env(safe-area-inset-left)); transform-origin: left center; }
  body.toque.paisagem #acoes { right: calc(8px + env(safe-area-inset-right)); transform-origin: right center; }
  #dpad { left: calc(16px + env(safe-area-inset-left)); width: 168px; height: 168px; border-radius: 50%; background: rgba(28,28,28,.5); border: 1px solid #333; }
  #dpad span { position: absolute; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #777; font: 18px sans-serif; pointer-events: none; }
  #dpad span.on { background: rgba(130,130,130,.35); color: #e6e6e6; }
  #dpad [data-d=cima] { left: 56px; top: 0; } #dpad [data-d=baixo] { left: 56px; top: 112px; }
  #dpad [data-d=esquerda] { left: 0; top: 56px; } #dpad [data-d=direita] { left: 112px; top: 56px; }
  #acoes { right: calc(16px + env(safe-area-inset-right)); width: 152px; height: 168px; }
  .pad button { position: absolute; padding: 0; border-radius: 50%; border: 1px solid #444; background: rgba(40,40,40,.55); color: #aaa; font: 14px "Courier New", monospace; touch-action: none; }
  .pad button.on { background: rgba(130,130,130,.5); color: #eee; }
  #acoes [data-k=ok] { right: 0; top: 48px; width: 76px; height: 76px; font-size: 16px; }
  #acoes [data-k=cancelar] { right: 88px; top: 106px; width: 58px; height: 58px; }
  #acoes [data-k=inventario] { right: 88px; top: 4px; width: 58px; height: 58px; }
  body.toque.tela-cheia-ok #tela-cheia { display: block; position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(6px + env(safe-area-inset-right));
    width: 40px; height: 40px; padding: 0; border: 1px solid #333; border-radius: 8px; background: rgba(30,30,30,.5); color: #888; font: 18px sans-serif; }
</style>
