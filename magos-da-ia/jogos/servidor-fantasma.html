*{box-sizing:border-box}

.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}button:focus-visible,input:focus-visible{outline:3px solid #a8ffe5;outline-offset:3px}
input{font-family:inherit;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#hud{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:5}

#menuRow{display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#menuRow button{pointer-events:auto;min-width:44px;height:36px;border-radius:9px;border:1px solid #4b4380;background:rgba(28,24,54,.92);color:#e9e6ff;font-size:12px;font-weight:bold;padding:0 9px}
#menuRow button:active{background:#3a3270}
#chat{pointer-events:auto;height:176px;background:rgba(13,11,26,.66);border:1px solid #3a3360;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
#chatLog{flex:1;min-height:0;overflow-y:auto;padding:6px 8px;font-size:12px;line-height:1.38;touch-action:pan-y;overscroll-behavior:contain;word-break:break-word}
#chatForm{display:flex;border-top:1px solid #3a3360}
#chatIn{flex:1;min-width:0;background:rgba(0,0,0,.4);border:0;color:#fff;padding:8px 10px;font-size:16px;outline:none}
#chatForm button{border:0;background:#3a3270;color:#fff;font-weight:bold;padding:0 12px;font-size:13px}
#dock.mini #chat{height:56px}
#dock.mini #chatForm{display:none}
#dock.mini #chatLog{overflow:hidden}
body.compact #dock{width:auto;right:calc(164px + var(--sar))}
body.compact #chatLog{font-size:11px}
body.compact #dock:not(.mini){right:calc(8px + var(--sar));bottom:calc(238px + var(--sab));z-index:8}
body.compact #dock:not(.mini) #chat{height:34vh}
@media (orientation:landscape){
body.compact #dock:not(.mini){right:calc(164px + var(--sar));bottom:calc(8px + var(--sab))}
body.compact #dock:not(.mini) #chat{height:56vh}
}
#skills{position:fixed;pointer-events:none;display:grid;gap:8px;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);grid-template-columns:repeat(6,58px);grid-auto-rows:58px}
@media (max-width:1120px){#skills{left:auto;right:calc(10px + var(--sar));transform:none}}
body.compact #skills{left:auto;transform:none;right:calc(10px + var(--sar));grid-template-columns:66px 66px;grid-auto-rows:66px}
.sk,.pot{pointer-events:auto;position:relative;border:2px solid #4b4380;border-radius:14px;background:#1c1836;color:#fff;padding:0;overflow:hidden;touch-action:none}
.sk{order:1}.pot{order:2}
body.compact .pot{order:0}
.sk canvas,.pot canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.key{position:absolute;left:5px;top:2px;font-size:11px;font-weight:bold;color:#ffd166;text-shadow:0 1px 0 #000;pointer-events:none}
body.touch .key{display:none}
.cdm{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(8,6,20,.8);pointer-events:none}
.cdt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:bold;font-size:17px;text-shadow:0 1px 2px #000;pointer-events:none}
.cnt{position:absolute;right:5px;bottom:2px;font-size:12px;font-weight:bold;text-shadow:0 1px 0 #000;pointer-events:none}
.sk.off{border-color:#2c2748}
.sk.off canvas{opacity:.4}
.sk:active,.pot:active{border-color:#7dffd6}

#toast span{flex:1 1 100%;text-align:center}
#toast button{height:42px;min-width:104px;border-radius:9px;border:0;font-weight:bold;font-size:14px;color:#0d0b1a;background:#7dffd6}
#toast #toastNo{background:#4b4380;color:#fff}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(440px,calc(100vw - 16px));max-height:min(80vh,640px);display:flex;flex-direction:column;background:#17142b;border:2px solid #4b4380;border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.65)}

.row .inf{flex:1;min-width:0}
.row .inf b{display:block;font-size:13.5px}
.row .inf small{display:block;color:#a9a3cf;font-size:12px}
.b{min-height:40px;min-width:64px;border-radius:9px;border:0;background:#3a3270;color:#fff;font-weight:bold;font-size:13px;padding:0 10px}
.b.go{background:#7dffd6;color:#0d0b1a}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13px;margin:6px 0 10px;color:#cfc9f5}
.gold{color:#ffd166;font-weight:bold}

.tbox{width:100%;max-width:470px;margin:auto 0;text-align:center}
h1{margin:6px 0 2px;font-size:clamp(30px,9vw,54px);letter-spacing:3px;line-height:1;color:#e9e6ff;text-shadow:0 0 18px rgba(125,255,214,.35)}

.tip{font-size:12px;color:#8f89bd;line-height:1.45;margin:6px 0}
#err{position:fixed;left:6px;right:6px;top:6px;z-index:99;display:none;margin:0;padding:8px;background:rgba(120,10,30,.92);color:#fff;font-size:12px;white-space:pre-wrap;border-radius:8px;max-height:40vh;overflow:auto;pointer-events:none}

</head>
