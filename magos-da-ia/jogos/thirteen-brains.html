<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#05070a">
<title>Thirteen Brains</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070a; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: crosshair; }
#safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#err { position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 40%; overflow: auto; margin: 0; padding: 8px 10px;
  background: rgba(60, 0, 0, .92); color: #ffd9d9; font: 12px/1.35 monospace; white-space: pre-wrap; border: 1px solid #f66;
  border-radius: 6px; z-index: 9; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<pre id="err"></pre>
<script>
'use strict';
(function () {
// ===================== error overlay =====================
var errBox = document.getElementById('err'), errCount = 0;
function showErr(msg) {

}
window.addEventListener('error', function (e) {

});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason; showErr('Promise: ' + (r && r.message ? r.message : String(r)));
});

// ===================== basics =====================
var TAU = Math.PI * 2, R = 380;
var SANS = '"Trebuchet MS","Segoe UI",system-ui,sans-serif', SERIF = 'Georgia,"Times New Roman",serif';
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W = 300, H = 300, DPR = 1, SC = 1, CX = 150, CY = 150, U = 1, hudTop = 78, HUDC = false, bgDirty = true;
var safe = { t: 0, r: 0, b: 0, l: 0 };
var isTouch = false;
try { isTouch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) {}
var bg = document.createElement('canvas'), fogSprite = null;
var keys = {}, mouse = { x: 0, y: 0, has: false, down: false };
var joy = { id: -1, bx: 0, by: 0, dx: 0, dy: 0, hx: 90, hy: 200 };
var bA = { id: -1, x: 0, y: 0, r: 46 }, bB = { id: -1, x: 0, y: 0, r: 38 };
var uiBtns = [], paused = false;

// ===================== layout =====================
function readSafe() {
  try {
    var cs = window.getComputedStyle(document.getElementById('safe'));
    safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function layout() {
  W = Math.max(200, window.innerWidth || 300); H = Math.max(200, window.innerHeight || 300);
  DPR = Math.min(2, window.devicePixelRatio || 1);

  readSafe();
  U = clamp(Math.min(W, H) / 430, 0.8, 1.7);
  HUDC = H < 520;
  hudTop = safe.t + (HUDC ? 46 : 78);
  var portrait = H >= W;
  var ctrl = (isTouch && portrait) ? 190 : 10;
  var availW = W - safe.l - safe.r - 8;
  var availH = H - hudTop - safe.b - ctrl;

  CY = hudTop + availH / 2;
  if (portrait) CY = hudTop + size / 2 + Math.min(16, Math.max(0, (availH - size) / 2));

  bB.x = W - safe.r - 162; bB.y = H - safe.b - 54;

}

// ===================== audio (all synthesized) =====================

  hiss: function () { noise(0.4, 0.28, 5200, 0.7, 'highpass', 0, 1500); },

  warn: function () { tone(660, 0.12, 'square', 0.09, 990); },

  roar: function () { tone(110, 0.8, 'sawtooth', 0.3, 45); noise(0.8, 0.32, 320, 0.8, 'lowpass', 0, 90); },

function setMusic(mode, rootSemis, stepDur) { mus.mode = mode; mus.root = semi(98, rootSemis || 0); mus.dur = stepDur || 0.17; }

}

// Thirteen encounters: each boss changes the arena rule or attack pattern.
var bosses = [
  ['Jean', 'Strike after the dash'], ['Dan', 'Attack from behind'], ['JV', 'Strike between rings'],
  ['Darci', 'Attack after the slam'], ['Felip', 'Strike after a burst'],
  ['Vini', 'Bite while moving'], ['brunnno', 'Break the shield with three bites'],
  ['Zé', 'Strike outside the poison'], ['lucas', 'Strike from the left'],
  ['choi', 'Strike from above'], ['berã', 'Attack while the boss is slow'],
  ['Zaq', 'Strike between storms'], ['Peles', 'Dodge the charge, then bite']
];
var mode = 'intro', index = 0, player = null, boss = null, shots = [], pools = [], last = 0, clock = 0, attackCooldown = 0, invincible = 0, eaten = 0, winDelay = 0;
function startBoss() {

  boss = { x: 0, y: -130, hp: 100, angle: Math.PI / 2, timer: 0, shield: 3, phase: 0 };
  shots = []; pools = []; attackCooldown = 0; invincible = 0; clock = 0; mode = 'fight'; setMusic('fight', index, 0.17);
}
function hurt(amount) { if (invincible > 0 || mode !== 'fight') return; player.hp -= amount; invincible = 0.8; sfx.hurt(); if (player.hp <= 0) { mode = 'dead'; setMusic('drone', -5, 0.3); sfx.die(); } }
function bite() {
  if (mode === 'intro') { initAudio(); index = 0; eaten = 0; startBoss(); return; }
  if (mode === 'dead' || mode === 'victory') { mode = 'intro'; return; }
  if (mode !== 'fight' || attackCooldown > 0) return;
  initAudio(); attackCooldown = 0.35; sfx.claw();
  if (dist(player.x, player.y, boss.x, boss.y) > 70) return;
  var vulnerable = true, phase = boss.timer % 4;
  if (index === 0 || index === 3 || index === 12) vulnerable = phase > 2.1;
  if (index === 1) vulnerable = Math.abs(angDiff(Math.atan2(player.y - boss.y, player.x - boss.x), boss.angle)) > 1.5;
  if (index === 2) vulnerable = boss.phase > .7;
  if (index === 4) vulnerable = boss.phase > .45;
  if (index === 5) vulnerable = !!(keys.ArrowRight || keys.KeyD || keys.ArrowLeft || keys.KeyA || keys.ArrowDown || keys.KeyS || keys.ArrowUp || keys.KeyW || joy.dx || joy.dy);

  if (index === 9) vulnerable = player.y < boss.y - 5;

  if (index === 11) vulnerable = boss.phase > .25;
