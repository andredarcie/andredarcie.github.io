function atualizarMapa(){if(!p||mapaTela.style.display==='none')return;const g=mapaTela.getContext('2d'),esc=16;g.fillStyle='#171918';g.fillRect(0,0,256,192);mapa.forEach((linha,y)=>Array.from(linha).forEach((celula,x)=>{g.fillStyle=celula==='#'?'#6c6050':'#2d302b';g.fillRect(x*esc,y*esc,esc-1,esc-1)}));objetos.forEach(o=>{if(!o.pego){g.fillStyle='#e5bc72';g.fillRect(o.x*esc-3,o.y*esc-3,6,6)}});if(etapa===3){g.fillStyle='#83caa5';g.fillRect(24,152,8,8)}g.fillStyle='#e7e3d3';g.beginPath();g.arc(p.x*esc,p.y*esc,4,0,Math.PI*2);g.fill();g.strokeStyle='#e7e3d3';g.beginPath();g.moveTo(p.x*esc,p.y*esc);g.lineTo((p.x+Math.cos(p.a)*.8)*esc,(p.y+Math.sin(p.a)*.8)*esc);g.stroke()}
function presagio(){if(!rodando||dirigindo){rota.textContent='';mapaTela.style.display='none';return}const alvo=etapa===3?{x:1.5,y:9.5,nome:'jipe'}:objetos.filter(o=>!o.pego).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(alvo){let angulo=Math.atan2(alvo.y-p.y,alvo.x-p.x)-p.a;angulo=Math.atan2(Math.sin(angulo),Math.cos(angulo));rota.textContent=(etapa===3?'Jipe':'Objeto próximo')+' '+(Math.abs(angulo)<.45?'↑':angulo>0?'→':'←')+(mapaTela.style.display==='none'?' · M para mapa':' · dourado: objetos; verde: jipe')}atualizarMapa();objetos.forEach((o,i)=>{if(!o.pego&&!o.avisou&&Math.hypot(o.x-p.x,o.y-p.y)<2.3){o.avisou=true;sussurro(i);texto.textContent=['Do outro lado, uma caixa se fecha sozinha.','O relógio começa a bater antes de você alcançá-lo.','O motor do jipe ronca sem ninguém ao volante.'][i];mensagem=4}})}
window.render_game_to_text=()=>JSON.stringify({fase:!rodando?'fim':dirigindo?'jipe':'fazenda',posicao:p&&{x:p.x,y:p.y,angulo:p.a},objetos:objetos&&objetos.map(o=>({nome:o.nome,x:o.x,y:o.y,coletado:!!o.pego})),objetivo:objetivo.textContent});
function frame(t){let dt=Math.min((t-ultimo)/1000||0,.05);ultimo=t;if(p){atualizar(dt);presagio();if(dirigindo)desenharEstrada();else desenharCena()}requestAnimationFrame(frame)}document.getElementById('iniciar').onclick=iniciar;document.getElementById('acao').onclick=examinar;document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyM'&&!e.repeat)mapaBotao.click();if(e.code==='Space'){e.preventDefault();if(!e.repeat)examinar()}if(e.code.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});tela.onclick=()=>{if(rodando&&tela.requestPointerLock)tela.requestPointerLock()};document.addEventListener('mousemove',e=>{if(document.pointerLockElement===tela&&p)p.a+=e.movementX*.003});document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.k]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=false});requestAnimationFrame(frame);
