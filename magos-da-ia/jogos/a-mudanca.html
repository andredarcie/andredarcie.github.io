<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Mudança</title><style>html,body{margin:0;background:#080809;color:#e1d8ca;font:16px Georgia,serif}canvas{display:block;width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#texto{position:absolute;bottom:12%;width:100%;text-align:center;font-size:clamp(16px,2.2vw,23px)}#objetivo{position:absolute;top:20px;left:20px}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#090807e8;text-align:center;padding:20px}button{padding:14px 25px;background:#6f3029;color:white;border:1px solid #b58974;font:18px Georgia;cursor:pointer}.oculto{display:none!important}#controles{position:fixed;bottom:12px;right:12px}#controles button{padding:10px;touch-action:none}</style></head><body><canvas id="tela" width="640" height="400"></canvas><div id="ui"><div id="objetivo"></div><div id="texto"></div></div><div id="menu"><div><h1>A Mudança</h1><p>A fazenda está vazia. As três irmãs já partiram — ou assim disseram.</p><p>WASD ou setas para andar · mouse ou Q/E para olhar · Espaço para examinar</p><button id="iniciar">Entrar na fazenda</button></div></div><div id="controles"><button data-k="KeyA">◀</button><button data-k="KeyW">▲</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button><button id="acao">Examinar</button></div><script>
'use strict';
const tela=document.getElementById('tela'),ctx=tela.getContext('2d'),menu=document.getElementById('menu'),texto=document.getElementById('texto'),objetivo=document.getElementById('objetivo'),keys={};
const mapa=['################','#......#.......#','#......#.......#','#..............#','#......#.......#','###.####...#####','#..............#','#..............#','#...####.......#','#..............#','#..............#','################'];
let p,objetos,etapa,tempo,ultimo=0,mensagem=0,rodando=false,audio,ruido,pan,dirigindo=false,estrada=0,faixa=0;
function iniciar(){p={x:2.5,y:9.5,a:-1.57};objetos=[{x:2.5,y:2.5,nome:'caixa de retratos',cor:'#b89c76',texto:'Os retratos já estão embalados. Você ainda não havia tocado neles.'},{x:11.5,y:2.5,nome:'relógio',cor:'#c7b483',texto:'O relógio marca a hora exata em que você vai embora.'},{x:11.5,y:8.5,nome:'chave do jipe',cor:'#c9c5a3',texto:'As chaves estão mornas. Alguém acabou de usá-las.'}];etapa=0;tempo=0;mensagem=0;rodando=true;menu.classList.add('oculto');objetivo.textContent='Prepare a mudança: encontre os três objetos (0/3)';texto.textContent='O assoalho estala antes dos seus passos.';mensagem=5;iniciarSom();}
function iniciarSom(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(audio){audio.resume();return}audio=new A();let os=audio.createOscillator(),gain=audio.createGain();pan=audio.createStereoPanner();os.type='sawtooth';os.frequency.value=52;gain.gain.value=.025;os.connect(gain);gain.connect(pan);pan.connect(audio.destination);os.start();ruido=gain}catch(e){}}
function parede(x,y){let ix=Math.floor(x),iy=Math.floor(y);return iy<0||iy>=mapa.length||ix<0||ix>=mapa[0].length||mapa[iy][ix]==='#'}
function atualizar(dt){if(!rodando)return;tempo+=dt;mensagem=Math.max(0,mensagem-dt);if(!mensagem)texto.textContent='';if(dirigindo){estrada+=dt;faixa=Math.max(-1,Math.min(1,faixa+((keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0))*dt));if(estrada>8){rodando=false;menu.innerHTML='<div><h1>A estrada</h1><p>Pelo retrovisor, a fazenda desaparece.</p><p>No banco de trás, três sombras aguardam em silêncio.</p><button onclick="location.reload()">Recomeçar</button></div>';menu.classList.remove('oculto')}return}p.a+=((keys.KeyE||keys.ArrowRight?1:0)-(keys.KeyQ||keys.ArrowLeft?1:0))*1.9*dt;let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),dx=(Math.cos(p.a)*f-Math.sin(p.a)*s)*dt*2.1,dy=(Math.sin(p.a)*f+Math.cos(p.a)*s)*dt*2.1;if(!parede(p.x+dx+Math.sign(dx)*.2,p.y))p.x+=dx;if(!parede(p.x,p.y+dy+Math.sign(dy)*.2))p.y+=dy;if(pan)pan.pan.value=Math.sin(tempo*.3-p.a);if(ruido)ruido.gain.value=.02+etapa*.008;if(etapa===3&&p.x<2&&p.y>9){dirigindo=true;objetivo.textContent='Dirija o jipe para longe da fazenda.';texto.textContent='O motor pega. Algo se move no retrovisor.';mensagem=5}}
function examinar(){if(!rodando)return;let alvo=objetos.find(o=>!o.pego&&Math.hypot(o.x-p.x,o.y-p.y)<1.3);if(alvo){alvo.pego=true;etapa++;texto.textContent=alvo.texto;mensagem=6;objetivo.textContent=etapa===3?'Volte ao jipe, perto da entrada.':'Prepare a mudança: encontre os três objetos ('+etapa+'/3)'}else{texto.textContent=etapa===3?'O jipe espera perto da entrada.':'Nada aqui, apenas o som da casa respirando.';mensagem=3}}
function desenhar(){let teto=ctx.createLinearGradient(0,0,0,200);teto.addColorStop(0,'#17191a');teto.addColorStop(1,'#343432');ctx.fillStyle=teto;ctx.fillRect(0,0,640,200);let chao=ctx.createLinearGradient(0,200,0,400);chao.addColorStop(0,'#24201d');chao.addColorStop(1,'#493a2c');ctx.fillStyle=chao;ctx.fillRect(0,200,640,200);ctx.strokeStyle='#18151288';for(let y=210;y<400;y+=Math.max(4,(y-200)*.2)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke()}const prof=[];for(let x=0;x<640;x+=2){let a=p.a+Math.atan((x/320-1)*.7),d=0;while(d<18&&!parede(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d))d+=.04;let corr=d*Math.cos(a-p.a),h=Math.min(800,300/Math.max(.1,corr)),hx=p.x+Math.cos(a)*d,hy=p.y+Math.sin(a)*d,veio=Math.floor((hx+hy)*24)%7===0?8:0,tom=Math.max(12,Math.floor(105/(1+corr*.3))-veio);ctx.fillStyle=`rgb(${tom+12},${tom+2},${Math.floor(tom*.8)})`;ctx.fillRect(x,200-h/2,2,h);ctx.fillStyle='#1a141055';for(let y=200-h/2+h*.2;y<200+h/2;y+=Math.max(5,h*.24))ctx.fillRect(x,y,2,Math.max(1,h*.008));prof[x/2]=d}for(const o of objetos){if(o.pego)continue;let dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)<.7&&d>0.2){let x=320+Math.tan(a)/.7*320,h=Math.min(200,90/d);if(d<(prof[Math.max(0,Math.min(319,Math.floor(x/2)))]||0)){ctx.fillStyle='#473326';ctx.fillRect(x-h/2-3,200-h/2-3,h+6,h+6);ctx.fillStyle=o.cor;ctx.fillRect(x-h/2,200-h/2,h,h);ctx.fillStyle='#e4d1a455';ctx.fillRect(x-h*.3,200-h*.3,h*.6,h*.08)}}}ctx.fillStyle='#ffffff99';ctx.fillRect(319,199,2,2);let escurecer=Math.min(.45,tempo/500);ctx.fillStyle=`rgba(0,0,0,${escurecer})`;ctx.fillRect(0,0,640,400)}
function desenharEstrada(){ctx.fillStyle='#10151c';ctx.fillRect(0,0,640,200);ctx.fillStyle='#172016';ctx.fillRect(0,200,640,200);ctx.fillStyle='#353231';ctx.beginPath();ctx.moveTo(290,190);ctx.lineTo(350,190);ctx.lineTo(620-faixa*100,400);ctx.lineTo(20-faixa*100,400);ctx.closePath();ctx.fill();ctx.strokeStyle='#bfae80';ctx.lineWidth=4;ctx.setLineDash([18,18]);ctx.lineDashOffset=-estrada*100;ctx.beginPath();ctx.moveTo(320,200);ctx.lineTo(320-faixa*100,400);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#0b0909';ctx.fillRect(0,355,640,45);ctx.fillStyle='#514a43';ctx.fillRect(255,20,130,42);ctx.fillStyle='#100f10';ctx.fillRect(260,25,120,32);ctx.fillStyle='#796e69';for(let i=0;i<3;i++)ctx.fillRect(278+i*31,34,15,20)}
function frame(t){let dt=Math.min((t-ultimo)/1000||0,.05);ultimo=t;if(p){atualizar(dt);if(dirigindo)desenharEstrada();else desenhar()}requestAnimationFrame(frame)}document.getElementById('iniciar').onclick=iniciar;document.getElementById('acao').onclick=examinar;document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(!e.repeat)examinar()}if(e.code.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});tela.onclick=()=>{if(rodando&&tela.requestPointerLock)tela.requestPointerLock()};document.addEventListener('mousemove',e=>{if(document.pointerLockElement===tela&&p)p.a+=e.movementX*.003});document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.k]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=false});requestAnimationFrame(frame);
</script></body></html>
