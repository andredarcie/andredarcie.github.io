<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bebum Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a0d06;color:#2b1408;
  font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
#ui.centro{align-items:center}
#ui.oculto{display:none}
#painel{pointer-events:auto;width:100%;max-width:560px;max-height:66%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff1cf;border:4px solid #2b1408;border-radius:20px;
  box-shadow:0 6px 0 #2b1408,0 14px 30px rgba(0,0,0,.45);padding:12px 12px 14px}
#ui.centro #painel{max-height:100%}
#painel.nu{background:transparent;border:none;box-shadow:none;height:100%;max-height:100%;display:flex;flex-direction:column;
  justify-content:space-between;color:#fff1cf;padding:4px}
@media (min-aspect-ratio:5/4){
  #ui{align-items:center;justify-content:flex-end}
  #ui.centro{justify-content:center}
  #painel{width:54%;max-height:100%}
  #ui.centro #painel{width:100%}
}
h1,h2,h3,p,ol{margin:0}
.logo{font-size:84px;font-size:min(17vw,13vh,84px);font-weight:900;line-height:.9;text-align:center;color:#ffd84a;letter-spacing:1px;
  transform:rotate(-4deg);margin:6px 0 10px;
  text-shadow:-3px -3px 0 #2b1408,3px -3px 0 #2b1408,-3px 3px 0 #2b1408,3px 3px 0 #2b1408,0 7px 0 #2b1408,0 12px 18px rgba(0,0,0,.5)}
.logo span{display:block;color:#ff6b3a}
.chamada{text-align:center;font-weight:900;font-size:16px;line-height:1.25;text-shadow:0 2px 0 #2b1408,0 0 8px #2b1408}
.ctl{text-align:center;font-size:13px;line-height:1.3;background:rgba(43,20,8,.82);border-radius:12px;padding:8px 10px}
.rodape{text-align:center;font-size:11px;opacity:.9;text-shadow:0 1px 0 #2b1408}
.tit{font-size:21px;font-weight:900;line-height:1.1;flex:1;min-width:0}
.sub{font-size:14px;line-height:1.35;margin-top:6px}
.sec{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;opacity:.75}
.linha{display:flex;gap:8px;align-items:center}
.esp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:9px}
.grana{background:#2b1408;color:#ffd84a;font-weight:900;font-size:18px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.b{-webkit-appearance:none;appearance:none;font:inherit;font-weight:900;font-size:18px;color:#2b1408;background:#ffcf3a;

  touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #2b1408}
.b.g{min-height:64px;font-size:21px}
.b.verde{background:#7be07b}.b.rosa{background:#ff8fb0}.b.azul{background:#8fd3ff}.b.branco{background:#fff}
.b.p{min-height:44px;font-size:15px;padding:6px 10px;border-width:2px;box-shadow:0 3px 0 #2b1408;white-space:nowrap}
.b.sel{background:#ff7a2a;color:#fff}
.b[disabled]{background:#d6cab2;color:#8a7d68;border-color:#8a7d68;box-shadow:0 2px 0 #8a7d68;cursor:default;transform:none}
.b small{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.card{background:#fff;border:3px solid #2b1408;border-radius:14px;padding:9px;display:flex;gap:9px;align-items:center}
.card.pilha{flex-direction:column;align-items:stretch}
.card .inf{flex:1;min-width:0}
.nm{font-weight:900;font-size:16px;line-height:1.15}
.ds{font-size:13px;line-height:1.3;margin-top:3px}
.card canvas{flex:none}
.tag{display:inline-block;font-size:11px;font-weight:900;background:#2b1408;color:#fff1cf;border-radius:999px;padding:2px 8px;margin:3px 4px 0 0;white-space:nowrap}
.tag.ok{background:#1c8a2e}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid #2b1408;background:#fff;display:inline-block}
.pips i.on{background:#ff7a2a}
.stats{display:flex;gap:6px;margin:8px 0 10px}
.st{flex:1 1 0;min-width:0;background:#fff;border:2px solid #2b1408;border-radius:10px;padding:5px 4px;font-size:11px;line-height:1.2;text-align:center}
.st b{display:block;font-size:15px}
.valor{flex:1;text-align:center;font-weight:900;font-size:24px;background:#fff;border:3px solid #2b1408;border-radius:12px;padding:6px 4px}
.res{font-size:32px;font-weight:900;text-align:center;line-height:1.05;margin:2px 0 4px}
.res.ok{color:#1c8a2e}.res.ruim{color:#c22b2b}
.rank{list-style:none;margin:8px 0;padding:0}
.rank li{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px;padding:6px 10px;border-radius:10px;
  background:#fff;border:2px solid #2b1408;margin-bottom:5px}
.rank li.eu{background:#ffe27a}
.rank li.fora{opacity:.6;text-decoration:line-through}
.ctr{text-align:center}
.mesa{display:flex;flex-direction:column;gap:8px;align-items:center;margin:10px 0}
.msg{min-height:24px;text-align:center;font-weight:900;font-size:18px;line-height:1.2}
.dado{width:54px;height:54px;background:#fff;border:3px solid #2b1408;border-radius:12px;display:inline-grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;gap:2px;box-shadow:0 3px 0 #2b1408;vertical-align:middle;margin:0 3px}
.dado i{border-radius:50%}
.dado i.on{background:#2b1408}
.aj{padding-left:20px;font-size:14px;line-height:1.35}
.aj li{margin:6px 0}
#erro{position:fixed;left:8px;right:8px;top:8px;z-index:99;margin:0;padding:8px 10px;background:#b00020;color:#fff;
  font:12px/1.35 monospace;white-space:pre-wrap;border-radius:8px;display:none;max-height:40%;overflow:auto;pointer-events:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#painel:not(.nu){background:#fff3d9;border-color:#492916;padding:clamp(18px,4vw,30px);box-shadow:0 8px 0 #492916,0 18px 45px #1d0b09aa}
#painel .tit{font-family:Georgia,serif;font-size:clamp(25px,5vw,38px);color:#532d1c}
#painel .sub{max-width:44ch;line-height:1.5;margin:8px 0 16px}
#painel>.b{width:100%;margin:8px 0;min-height:50px;align-items:flex-start;padding-left:18px}
button:focus-visible{outline:3px solid #31785d;outline-offset:3px}
</style>

    if (modo !== 'disputa') return; var camp = CAMP[rodada.camp], alvo = Math.max.apply(null, rodada.rivais.map(function(r){return r.pontos})), ganhou = forcado && rodada.pontos >= alvo; modo = 'resultado';
    if (ganhou) { S.grana += camp.premio; S.camp = Math.max(S.camp, rodada.camp + 1); S.vit++; sfx.vitoria(); } else { S.der++; sfx.derrota(); }
    salvar(); tela(ganhou ? 'Campeão!' : 'Fim da disputa', 'Você marcou ' + Math.floor(rodada.pontos) + ' pontos. Melhor rival: ' + Math.floor(alvo) + '. ' + (ganhou ? 'Prêmio: R$ ' + camp.premio : 'Tente melhorar seus atributos e sua bebida.')); botao('Voltar ao bar', centro);
  }
  var ultimoQuadro = 0, atualizaPainel = 0;
  function quadro(t) {
    var dt = Math.min(.05, (t - ultimoQuadro) / 1000 || 0); ultimoQuadro = t;
    if (modo === 'disputa') { rodada.restante -= dt; var camp = CAMP[rodada.camp], progresso = clamp(1 - rodada.restante / camp.dur, 0, 1); rodada.rivais.forEach(function(r){ r.pontos += r.alvo / camp.dur * Math.max(0, RIV[r.id].ritmo(progresso)) * dt; }); rodada.estomago = Math.max(0, rodada.estomago - digest() * dt); rodada.alcool = Math.max(0, rodada.alcool - sobrio() * dt); atualizaPainel += dt; if (rodada.restante <= 0) terminarDisputa(true); else if (atualizaPainel >= .5) { atualizaPainel = 0; disputaUI(); } }
    var g = $('cv').getContext('2d'), R = {x:0,y:0,w:W,h:H}, local = rodada ? CAMP[rodada.camp].venue : 0; g.setTransform(DPR, 0, 0, DPR, 0, 0); cenaFundo(g, R, local); luminarias(g, R, t / 1000); balcao(g, R, H * .74, local); musica(); requestAnimationFrame(quadro);
  }
  carregar(); resize(); window.addEventListener('resize', resize); centro(); requestAnimationFrame(quadro);
})();
