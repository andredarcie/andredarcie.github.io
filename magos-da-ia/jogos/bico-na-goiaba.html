<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bico na Goiaba</title>
<style>body{margin:0;background:#142a23;color:#f5edcf;font:15px Georgia,serif;text-align:center}canvas{display:block;width:min(100%,960px);height:auto;margin:auto;image-rendering:pixelated;touch-action:none;box-shadow:0 18px 50px #081711}button{background:#f2c75c;color:#382f1e;border:2px solid #947232;border-radius:5px;padding:10px 16px;margin:4px;font-weight:bold;cursor:pointer}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #fff2bd;outline-offset:3px}#painel{padding:10px;line-height:1.6}#painel strong{font-size:23px;letter-spacing:.03em;color:#f8d87e}@media(max-width:480px){#painel{font-size:13px;line-height:1.35}#painel strong{font-size:20px}button{padding:9px 13px}}</style></head><body>
<div id="painel"><strong>Bico na Goiaba</strong> · <span id="placar"></span><br>Setas ou A/D para voar pelos galhos · Espaço para pular · desvie das vespas<br><button id="iniciar">Começar</button><button id="esquerda">◀</button><button id="pulo">Pular</button><button id="direita">▶</button></div>
<canvas id="jogo" width="960" height="540"></canvas>
<script>
'use strict';
const canvas=document.getElementById('jogo'),ctx=canvas.getContext('2d'),placar=document.getElementById('placar');
const teclas={}; let estado='inicio',tempo=60,pontos=0,ultimo=0,invulneravel=0;
const galhos=[{x:0,y:500,w:960},{x:80,y:420,w:220},{x:400,y:405,w:180},{x:700,y:420,w:190},{x:240,y:315,w:180},{x:540,y:300,w:200},{x:70,y:220,w:190},{x:370,y:205,w:180},{x:700,y:205,w:190},{x:270,y:110,w:180},{x:570,y:95,w:170}];
let arara,frutas,vespas;
function reiniciar(){tempo=60;pontos=0;invulneravel=0;arara={x:100,y:460,vx:0,vy:0,chao:false};frutas=galhos.slice(1).map((g,i)=>({x:g.x+g.w/2,y:g.y-25,ativa:true,espera:0}));vespas=[{x:300,y:375,base:300,faixa:110,t:0},{x:650,y:260,base:650,faixa:120,t:2},{x:350,y:165,base:350,faixa:120,t:4}];estado='jogo';}
function atualizar(dt){if(estado!=='jogo')return;tempo=Math.max(0,tempo-dt);if(!tempo){estado='fim';return} invulneravel=Math.max(0,invulneravel-dt);
const dir=(teclas.ArrowRight||teclas.KeyD?1:0)-(teclas.ArrowLeft||teclas.KeyA?1:0);arara.vx=dir*220;const anterior=arara.y;arara.x=Math.max(14,Math.min(946,arara.x+arara.vx*dt));arara.vy+=750*dt;arara.y+=arara.vy*dt;arara.chao=false;
for(const g of galhos){if(arara.vy>=0&&anterior+16<=g.y&&arara.y+16>=g.y&&arara.x+13>g.x&&arara.x-13<g.x+g.w){arara.y=g.y-16;arara.vy=0;arara.chao=true;}}
for(const f of frutas){if(!f.ativa){f.espera-=dt;if(f.espera<=0)f.ativa=true}else if(Math.hypot(arara.x-f.x,arara.y-f.y)<25){f.ativa=false;f.espera=5;pontos++;}}
for(const v of vespas){v.t+=dt;v.x=v.base+Math.sin(v.t*1.7)*v.faixa;if(!invulneravel&&Math.hypot(arara.x-v.x,arara.y-v.y)<25){pontos=Math.max(0,pontos-2);invulneravel=2;arara.vy=-280;}}
}
function pular(){if(estado==='jogo'&&arara.chao){arara.vy=-440;arara.chao=false}}
function desenhar(){const sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#b2ddbe');sky.addColorStop(1,'#e1dfac');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);ctx.fillStyle='#d9eac9';ctx.beginPath();ctx.arc(790,70,38,0,Math.PI*2);ctx.fill();for(let i=0;i<24;i++){let x=(i*83)%1000,y=150+(i*47)%160;ctx.fillStyle=i%2?'#90ba83':'#a2c69a';ctx.beginPath();ctx.arc(x,y,45+(i%3)*10,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#614332';ctx.fillRect(448,0,90,540);ctx.fillStyle='#805b3b';ctx.fillRect(458,0,24,540);ctx.fillStyle='#4b372c';for(let y=18;y<540;y+=65){ctx.fillRect(493,y,6,35);ctx.fillRect(524,y+20,4,25)}for(let i=0;i<30;i++){let x=(i*113)%960,y=(i*79)%180;ctx.fillStyle=['#345b3d','#487746','#628f50'][i%3];ctx.beginPath();ctx.arc(x,y,32+(i%4)*7,0,Math.PI*2);ctx.fill()}for(const g of galhos){ctx.fillStyle='#50392d';ctx.fillRect(g.x,g.y,g.w,19);ctx.fillStyle='#85603d';ctx.fillRect(g.x+3,g.y+4,g.w-6,7);ctx.fillStyle='#688b48';ctx.fillRect(g.x,g.y,g.w,4);for(let x=g.x+15;x<g.x+g.w;x+=42){ctx.fillStyle='#416b3b';ctx.fillRect(x,g.y-5,15,5)}}
if(arara){for(const f of frutas)if(f.ativa){ctx.fillStyle='#264d31';ctx.fillRect(f.x-2,f.y-15,4,7);ctx.fillStyle='#b5d665';ctx.beginPath();ctx.arc(f.x,f.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eb8b7d';ctx.beginPath();ctx.arc(f.x+1,f.y+1,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe9b3';ctx.fillRect(f.x,f.y,2,2)}for(const v of vespas){ctx.fillStyle='#d9f4e7';ctx.fillRect(v.x-12,v.y-15,10,9);ctx.fillRect(v.x+2,v.y-15,10,9);ctx.fillStyle='#edbd36';ctx.fillRect(v.x-13,v.y-7,26,14);ctx.fillStyle='#44342b';ctx.fillRect(v.x-6,v.y-7,4,14);ctx.fillRect(v.x+3,v.y-7,4,14);ctx.fillRect(v.x+11,v.y-3,5,4)}if(!invulneravel||Math.floor(invulneravel*8)%2){let x=arara.x,y=arara.y;ctx.fillStyle='#11688b';ctx.fillRect(x-15,y-10,27,27);ctx.fillRect(x-19,y+8,8,18);ctx.fillStyle='#249bc1';ctx.fillRect(x-10,y-17,23,23);ctx.fillStyle='#ffd24e';ctx.fillRect(x-8,y+3,21,14);ctx.fillStyle='#227dad';ctx.fillRect(x-14,y-3,12,16);ctx.fillStyle='#f8edcf';ctx.fillRect(x+5,y-13,10,9);ctx.fillStyle='#1c292b';ctx.fillRect(x+11,y-10,3,3);ctx.fillRect(x+13,y-5,10,8);ctx.fillRect(x+16,y+2,5,4);ctx.fillStyle='#604632';ctx.fillRect(x-8,y+16,5,4);ctx.fillRect(x+4,y+16,5,4)}}
placar.textContent=`Goiabas: ${pontos} · Tempo: ${Math.ceil(tempo)}s`;if(estado!=='jogo'){ctx.fillStyle='#10281ed9';ctx.fillRect(190,180,580,150);ctx.fillStyle='#fff3ca';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText(estado==='fim'?'Tempo esgotado!':'Bico na Goiaba',480,240);ctx.font='20px system-ui';ctx.fillText(estado==='fim'?`Você colheu ${pontos} goiabas. Jogue novamente!`:'Colha goiabas durante um minuto.',480,285)}}
function quadro(t){const dt=Math.min((t-ultimo)/1000||0,0.04);ultimo=t;atualizar(dt);desenhar();requestAnimationFrame(quadro)}
document.addEventListener('keydown',e=>{teclas[e.code]=true;if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();if(!e.repeat)pular()}});document.addEventListener('keyup',e=>{teclas[e.code]=false});window.addEventListener('blur',()=>{for(const k in teclas)teclas[k]=false});
document.getElementById('iniciar').onclick=reiniciar;document.getElementById('pulo').onclick=pular;for(const [id,key] of [['esquerda','ArrowLeft'],['direita','ArrowRight']]){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);teclas[key]=true};b.onpointerup=b.onpointercancel=()=>teclas[key]=false}requestAnimationFrame(quadro);
</script></body></html>
