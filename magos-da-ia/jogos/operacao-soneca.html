<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operação Soneca</title><style>body{background:#242235;color:#fff3db;text-align:center;font:16px system-ui;margin:0}h1{font:700 clamp(25px,5vw,38px) Georgia,serif;margin:14px 0 5px}p{margin:5px auto 12px;max-width:56ch;padding:0 12px;line-height:1.4}canvas{display:block;margin:auto;width:min(100%,800px);height:auto;touch-action:none;box-shadow:0 12px 38px #12111d}button{padding:10px 18px;margin:4px;border:0;border-radius:8px;background:#f1c77b;color:#332633;font-weight:bold;cursor:pointer}button:focus-visible{outline:3px solid #fff3db;outline-offset:3px}@media(max-width:480px){body{font-size:13px}button{padding:10px 12px}}</style></head><body><h1>Operação Soneca</h1><p id="info">Leve o gato ao sofá sem acordar a casa. Setas ou WASD para andar; Shift para esgueirar.</p><canvas id="c" width="800" height="520"></canvas><div><button id="start">Começar / reiniciar</button><br><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="ShiftLeft">Furtivo</button></div><script>
'use strict';
const c=document.getElementById('c'),g=c.getContext('2d'),info=document.getElementById('info'),keys={};let fase=0,modo='menu',gato,alerta=0,tempo=0,ultimo=0,inv=0;
const fases=[{nome:'Sala de estar',humanos:1,caes:0,asp:0,brinquedos:3},{nome:'Corredor dos roncos',humanos:2,caes:1,asp:0,brinquedos:5},{nome:'A casa acordou',humanos:2,caes:1,asp:1,brinquedos:7}];let obstaculos,guardas,brinquedos;
function iniciarFase(){gato={x:55,y:465};alerta=0;inv=0;tempo=0;obstaculos=[{x:190,y:65,w:35,h:280},{x:370,y:180,w:35,h:280},{x:550,y:60,w:35,h:280}];brinquedos=Array.from({length:fases[fase].brinquedos},(_,i)=>({x:135+(i*117)%590,y:105+(i*137)%330,ativo:true}));guardas=[];for(let i=0;i<fases[fase].humanos;i++)guardas.push({tipo:'humano',x:275+i*360,y:170,base:275+i*360,t:i*2});for(let i=0;i<fases[fase].caes;i++)guardas.push({tipo:'cão',x:480,y:365,base:480,t:1});if(fases[fase].asp)guardas.push({tipo:'aspirador',x:620,y:390,base:620,t:3});modo='jogo'}
function colisao(x,y){return x<12||x>788||y<12||y>508||obstaculos.some(o=>x+10>o.x&&x-10<o.x+o.w&&y+10>o.y&&y-10<o.y+o.h)}
function update(dt){if(modo!=='jogo')return;tempo+=dt;inv=Math.max(0,inv-dt);let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);const len=Math.hypot(dx,dy)||1,vel=keys.ShiftLeft?70:145;dx=dx/len*vel*dt;dy=dy/len*vel*dt;if(!colisao(gato.x+dx,gato.y))gato.x+=dx;if(!colisao(gato.x,gato.y+dy))gato.y+=dy;
for(const b of brinquedos)if(b.ativo&&Math.hypot(gato.x-b.x,gato.y-b.y)<22){b.ativo=false;alerta=Math.min(100,alerta+25);info.textContent='PLOFT! O brinquedo fez barulho.'}
let visto=false;for(const a of guardas){a.t+=dt;a.y=240+Math.sin(a.t*(a.tipo==='cão'?1.4:.7))*140;const d=Math.hypot(gato.x-a.x,gato.y-a.y);if(d<(keys.ShiftLeft?43:85))visto=true;if(d<23&&!inv){alerta+=38;inv=1;gato.x=55;gato.y=465;info.textContent='Flagrado! O gato finge que não fez nada.'}}
alerta=Math.max(0,Math.min(100,alerta+(visto?30:-8)*dt));if(alerta>=100){modo='perdeu';info.textContent='A casa acordou! Clique em reiniciar para tentar novamente.'}if(gato.x>730&&gato.y<85){if(fase===fases.length-1){modo='venceu';info.textContent='Missão cumprida: soneca épica!'}else{fase++;iniciarFase();info.textContent='Próxima fase: '+fases[fase].nome}}}
function desenhar(){g.fillStyle='#be9d79';g.fillRect(0,0,800,520);g.strokeStyle='#ac8968';for(let y=0;y<520;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(800,y);g.stroke()}g.fillStyle='#5b3b32';for(const o of obstaculos||[])g.fillRect(o.x,o.y,o.w,o.h);g.fillStyle='#7b5c87';g.fillRect(720,20,65,65);g.fillStyle='#d6bed9';g.fillRect(728,28,49,18);g.font='24px system-ui';g.fillText('💤',737,70);for(const b of brinquedos||[])if(b.ativo)g.fillText('🧸',b.x-12,b.y+8);for(const a of guardas||[]){g.globalAlpha=.13;g.fillStyle='#ffdb62';g.beginPath();g.arc(a.x,a.y,85,0,7);g.fill();g.globalAlpha=1;g.fillText(a.tipo==='humano'?'🧍':a.tipo==='cão'?'🐕':'🤖',a.x-12,a.y+9)}if(gato)g.fillText('🐈',gato.x-15,gato.y+9);g.fillStyle='#fff';g.font='bold 18px system-ui';g.fillText('Alerta: '+Math.round(alerta)+'%',15,27);g.fillText(fases[fase].nome,300,27);if(modo!=='jogo'){g.fillStyle='#211b2cdd';g.fillRect(120,190,560,130);g.fillStyle='white';g.textAlign='center';g.font='bold 30px system-ui';g.fillText(modo==='venceu'?'Boa soneca!':modo==='perdeu'?'A casa acordou!':'Operação Soneca',400,245);g.font='18px system-ui';g.fillText('Clique em Começar / reiniciar',400,280);g.textAlign='start'}}
function desenhar(){g.fillStyle='#be9b78';g.fillRect(0,0,800,520);for(let y=0;y<520;y+=40){g.fillStyle=y%80?'#b28d6e':'#c8a784';g.fillRect(0,y,800,38);g.strokeStyle='#9e785c';g.strokeRect(-1,y,802,40);for(let x=(y%80?40:0);x<800;x+=140){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+40);g.stroke()}}
g.fillStyle='#825e53';g.fillRect(20,55,138,95);g.fillStyle='#c79d7c';g.fillRect(27,62,124,81);g.strokeStyle='#e6c4a0';g.lineWidth=3;g.strokeRect(34,69,110,67);g.fillStyle='#725858';g.beginPath();g.ellipse(75,112,25,13,0,0,7);g.fill();g.fillStyle='#765b53';g.fillRect(610,360,120,100);g.fillStyle='#bd8a6c';g.fillRect(617,367,106,86);g.strokeStyle='#e6bca0';g.strokeRect(625,375,90,70);
for(const o of obstaculos||[]){g.fillStyle='#573d39';g.fillRect(o.x+5,o.y+7,o.w,o.h);g.fillStyle='#826356';g.fillRect(o.x,o.y,o.w,o.h);g.fillStyle='#a1806b';g.fillRect(o.x+4,o.y+4,o.w-8,o.h-8);for(let y=o.y+36;y<o.y+o.h-8;y+=50){g.fillStyle='#704d43';g.fillRect(o.x+7,y,o.w-14,4)}}
g.fillStyle='#4b384d';g.fillRect(716,16,73,73);g.fillStyle='#826786';g.fillRect(720,20,65,61);g.fillStyle='#a68ba5';g.fillRect(727,27,51,20);g.fillStyle='#d0bbc5';g.fillRect(728,28,22,17);g.fillRect(755,28,21,17);g.fillStyle='#59465e';g.fillRect(728,69,49,8);
for(const b of brinquedos||[])if(b.ativo){g.fillStyle='#7b4c41';g.beginPath();g.arc(b.x,b.y,8,0,7);g.fill();g.beginPath();g.arc(b.x-6,b.y-7,4,0,7);g.arc(b.x+6,b.y-7,4,0,7);g.fill();g.fillStyle='#e3ba91';g.fillRect(b.x-2,b.y,4,3)}
for(const a of guardas||[]){g.globalAlpha=.12;g.fillStyle='#ffe0a0';g.beginPath();g.arc(a.x,a.y,85,0,7);g.fill();g.globalAlpha=1;g.fillStyle='#45323855';g.beginPath();g.ellipse(a.x,a.y+9,13,6,0,0,7);g.fill();if(a.tipo==='humano'){g.fillStyle='#607e82';g.beginPath();g.ellipse(a.x,a.y,12,16,0,0,7);g.fill();g.fillStyle='#dfb591';g.beginPath();g.arc(a.x,a.y-4,7,0,7);g.fill();g.fillStyle='#513c34';g.fillRect(a.x-7,a.y-12,14,5)}else if(a.tipo==='cão'){g.fillStyle='#a8734d';g.beginPath();g.ellipse(a.x,a.y,15,10,0,0,7);g.fill();g.fillStyle='#694837';g.beginPath();g.arc(a.x+11,a.y-5,7,0,7);g.fill()}else{g.fillStyle='#a9adb1';g.beginPath();g.arc(a.x,a.y,14,0,7);g.fill();g.fillStyle='#647078';g.beginPath();g.arc(a.x,a.y,9,0,7);g.fill();g.fillStyle='#ed6d60';g.fillRect(a.x-2,a.y-2,4,4)}}
if(gato){g.fillStyle='#44312e55';g.beginPath();g.ellipse(gato.x,gato.y+8,13,6,0,0,7);g.fill();g.strokeStyle='#bf7d4d';g.lineWidth=5;g.beginPath();g.moveTo(gato.x-9,gato.y+3);g.quadraticCurveTo(gato.x-23,gato.y-4,gato.x-18,gato.y-13);g.stroke();g.fillStyle='#d89a5d';g.beginPath();g.ellipse(gato.x,gato.y,12,9,0,0,7);g.fill();g.beginPath();g.arc(gato.x+7,gato.y-5,7,0,7);g.fill();g.fillStyle='#71493e';g.beginPath();g.moveTo(gato.x+2,gato.y-9);g.lineTo(gato.x+3,gato.y-16);g.lineTo(gato.x+8,gato.y-10);g.fill();g.fillRect(gato.x-5,gato.y-5,3,10);g.fillRect(gato.x,gato.y-7,3,12)}
g.fillStyle='#2d2932dd';g.fillRect(10,10,190,30);g.fillStyle='#fff1d7';g.font='bold 14px system-ui';g.fillText('ALERTA '+Math.round(alerta)+'%',20,30);g.fillStyle='#d18c71';g.fillRect(105,22,alerta*.8,6);g.textAlign='center';g.fillStyle='#3b3035';g.font='bold 17px Georgia';g.fillText(fases[fase].nome,400,28);g.textAlign='start';if(modo!=='jogo'){g.fillStyle='#211b2ce8';g.fillRect(120,190,560,130);g.fillStyle='#fff0d5';g.textAlign='center';g.font='bold 30px Georgia';g.fillText(modo==='venceu'?'Boa soneca!':modo==='perdeu'?'A casa acordou!':'Operação Soneca',400,245);g.font='18px system-ui';g.fillText('Clique em Começar / reiniciar',400,280);g.textAlign='start'}}
function frame(t){const dt=Math.min((t-ultimo)/1000||0,.04);ultimo=t;update(dt);desenhar();requestAnimationFrame(frame)}document.getElementById('start').onclick=()=>{fase=0;iniciarFase();info.textContent='Leve o gato ao sofá sem acordar a casa.'};document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.key]=false});requestAnimationFrame(frame);
</script></body></html>
