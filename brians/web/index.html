<style>
  :root { color-scheme: dark; --fundo: #000; --texto: #ddd; --suave: #777; --borda: #444; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
    font: 14px/1.4 "Open Sans", system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #palco { position: fixed; inset: 0; display: grid; place-items: center; }
  #tela { width: min(100vw, calc(100vh * 544 / 416)); aspect-ratio: 544 / 416;
    image-rendering: pixelated; background: #000; display: block; }
  #status { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--suave); }
  #build { position: fixed; right: 8px; bottom: 6px; z-index: 11; color: #333; font-size: 11px; }
  /* ?gravar / ?replay (src/rastro.js) */
  #rastro { position: fixed; right: 8px; top: 8px; color: #e66; font-size: 12px; }
  #baixar-replay { position: fixed; right: 8px; top: 28px; font: inherit; font-size: 12px; color: #ccc;
    background: #111; border: 1px solid var(--borda); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
  /* Tela de carregamento: a arte do título (a mesma URL que o jogo pede, sai
     do cache) com uma janela no estilo do windowskin do jogo (Window.png:
     vinho com moldura cinza, texto branco com sombra). Funciona sem JS de
     módulo: o script inline no fim do body cuida dela até o boot assumir. */
  #carregando { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #000; }
  #carregando .quadro { position: relative; width: min(100vw, calc(100vh * 544 / 416)); aspect-ratio: 544 / 416;
    background: #000 url("../projeto/Graphics/System/Title.png") center / 100% 100% no-repeat; image-rendering: pixelated; }
  #carregando .janela { position: absolute; left: 50%; top: 56%; transform: translateX(-50%);
    width: min(92vw, 400px); padding: 12px 16px 14px; color: #fff;
    font: 14px/1.45 Verdana, "Open Sans", sans-serif; text-shadow: 1px 1px 0 #000;
    background: rgb(112 0 0 / .88); border: 2px solid #a8a8a8; border-radius: 6px;
    box-shadow: inset 0 0 0 1px #3a0000, 0 0 0 1px #000; }
  #carregando .etapa { margin: 0 0 8px; }
  #carregando .barra { height: 14px; padding: 2px; background: #1a0000; border: 1px solid #a8a8a8; border-radius: 2px; }
  #carregando .barra span { display: block; height: 100%; width: 0; transition: width .25s;
    background: repeating-linear-gradient(90deg, #8fb0de 0 6px, #7b9dcc 6px 8px); }
  #carregando .detalhe { margin: 6px 0 0; min-height: 1.45em; font-size: 12px; color: #e6c9c9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #carregando .lenta { margin: 4px 0 0; font-size: 12px; color: #fd6; }
  #carregando pre { margin: 8px 0 0; max-height: 30vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.4 ui-monospace, Consolas, monospace; color: #fdd; background: rgb(0 0 0 / .35);
    padding: 6px 8px; border-radius: 2px; text-shadow: none; }
  #carregando button { margin-top: 10px; padding: 6px 22px; font: inherit; font-size: 15px; color: #fff;
    text-shadow: 1px 1px 0 #000; background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .35);
    border-radius: 3px; cursor: pointer; }
  #carregando button:hover, #carregando button:focus-visible { background: rgb(255 255 255 / .22); border-color: #fff; outline: none; }
  #carregando .pronto .barra span { background: #8fb0de; }
  #carregando .falhou .barra span { background: #c44; }
  #aviso { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .6); }
  #aviso > div { max-width: min(90vw, 560px); background: #111; border: 1px solid var(--borda);

  /* Seletor de fases: só em localhost (src/seletor-niveis.js) */

  #niveis h2 { margin: 0; font-size: 15px; font-weight: normal; }
  #niveis h2 small { color: var(--suave); }
  #niveis input { font: inherit; padding: 6px 8px; color: #fff; background: #000;
    border: 1px solid var(--borda); border-radius: 3px; outline: none; }
  #niveis input:focus { border-color: #888; }
  #niveis .aviso { margin: 0; color: #e9a; }
  #niveis .aviso:empty { display: none; }
  #niveis ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  #niveis li { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; padding-block: 1px; }
  #niveis li button { font: inherit; color: #ccc; background: none; border: 1px solid transparent;
    border-radius: 3px; padding: 2px 6px; cursor: pointer; text-align: left; }
  #niveis li button.mapa { flex: 1; }
  #niveis li button.entrada { font-size: 12px; color: var(--suave); }
  #niveis li button:hover, #niveis li button.foco { background: #222; border-color: #555; color: #fff; }
  #niveis li.atual button.mapa { color: #fd6; }
  #niveis .id { color: var(--suave); font-size: 12px; }

  /* Controle virtual: só em telas de toque */
  #controle { display: none; }
  @media (pointer: coarse) {
    #controle { display: block; position: fixed; inset: auto 0 0 0; height: 170px; pointer-events: none; }
    #controle .pad, #controle .acoes { position: absolute; bottom: 18px; pointer-events: auto; }
    #controle .pad { left: 18px; width: 138px; height: 138px; display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 2px; }
    #controle .acoes { right: 18px; display: flex; gap: 12px; align-items: flex-end; }
    #controle button { font: inherit; color: #ccc; background: rgb(255 255 255 / .1);
      border: 1px solid rgb(255 255 255 / .25); border-radius: 8px; user-select: none;
      -webkit-user-select: none; touch-action: none; }
    #controle .acoes button { width: 62px; height: 62px; border-radius: 50%; }
    /* Correr é liga/desliga: aceso enquanto ligado */
    #controle button.ligado { color: #1a1206; background: rgb(255 214 102 / .85); border-color: #fd6; }
    /* pausar e tela cheia, no canto de cima */
    #controle .topo { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      display: flex; gap: 8px; pointer-events: auto; }
    #controle .topo button { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
    #controle .topo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; }
    #tela-cheia .sair, #tela-cheia.ativa .entrar { display: none; }
    #tela-cheia.ativa .sair { display: block; }
  }
</style>

<script>
// Tela de carregamento (#carregando). Script clássico e inline de propósito:
// roda antes dos módulos, então mostra progresso enquanto o motor baixa e
// mostra o erro mesmo se main.js (ou um import dele) não chegar. Depois o
// boot (src/boot.js) assume pelas mesmas funções em window.__carga:
// etapa → progresso → pronto → fechar, ou erro.
(() => {
  const raiz = document.getElementById('carregando');
  const janela = raiz.querySelector('.janela');
  const $ = (s) => janela.querySelector(s);
  const barra = $('.barra'), preenchido = $('.barra span');
  let de = 0, ate = 0, aberto = true, falhou = false, ultimo = Date.now();
  let fase = 'motor', motor = 0, faltou = ''; // faltou: último arquivo que voltou 4xx/5xx

  const pintar = (fracao) => {
    const pct = Math.round(Math.min(100, Math.max(0, (de + (ate - de) * fracao))));
    preenchido.style.width = pct + '%';
    barra.setAttribute('aria-valuenow', pct);
    ultimo = Date.now();
    $('.lenta').hidden = true;
  };
  const nomeCurto = (u) => decodeURIComponent(String(u).split('?')[0].split('/').pop());

  // Mensagem que dá para entender + o detalhe técnico embaixo.
  function explicar(e) {
    const tecnico = String(e?.message ?? e ?? 'erro desconhecido');
    if (location.protocol === 'file:') return ['O jogo precisa de um servidor',
      'Aberto direto do arquivo (file://), o navegador bloqueia os scripts do jogo. Jogue pelo site ou rode um servidor local na pasta (ex.: npx serve).', tecnico];
    if (navigator.onLine === false) return ['Sem internet', 'A conexão caiu no meio do carregamento. Quando voltar, tente de novo.', tecnico];
    if (/webgl/i.test(tecnico)) return ['O navegador não consegue desenhar o jogo',
      'O jogo precisa de WebGL2. Atualize o navegador ou ative a aceleração de hardware.', tecnico];
    return ['Não deu para abrir o jogo', 'Algo falhou ao carregar. Tentar de novo costuma resolver; se continuar, o detalhe abaixo ajuda a achar o problema.', tecnico];
  }

  const carga = window.__carga = {
    get aberto() { return aberto; },
    etapa(texto, inicio, fim) {
      if (falhou) return;
      fase = 'boot';
      $('.etapa').textContent = texto;
      $('.detalhe').textContent = '';
      de = inicio; ate = fim;
      pintar(0);
    },
    progresso(feitos, total, arquivo) {
      if (falhou) return;
      pintar(total ? feitos / total : 1);
      $('.detalhe').textContent = `${feitos} de ${total}` + (arquivo ? ` · ${arquivo}` : '');
    },
    pronto() {
      if (falhou) return;
      de = ate = 100; pintar(1);
      janela.classList.add('pronto');
      $('.etapa').textContent = 'Tudo pronto.';
      $('.detalhe').textContent = '';
    },
    fechar() {
      aberto = false;
      raiz.hidden = true;
      observador?.disconnect();
      clearInterval(relogio);
    },
    erro(e) {
      if (!aberto) return;
      falhou = true;
      const [titulo, texto, tecnico] = explicar(e);
      janela.classList.add('falhou');
      $('.etapa').textContent = titulo;
      $('.detalhe').textContent = '';
      $('.lenta').hidden = false;
      $('.lenta').textContent = texto;
      const pre = $('pre');
      pre.hidden = false;
      pre.textContent = tecnico + (faltou && !tecnico.includes(faltou) ? `\núltimo arquivo que não veio: ${faltou}` : '');
      $('#jogar').hidden = true;
      const botao = $('.de-novo');
      botao.hidden = false;
      botao.onclick = () => location.reload();
      botao.focus();
    },
  };

  // Fase do motor (main.js e os ~40 módulos que ele importa): o total exato
  // não se sabe daqui, então a barra enche em curva até 35% e mostra a conta
  // de arquivos e o último que chegou. A mesma observação anota o último
  // arquivo que voltou com erro, para a mensagem de falha.
  carga.etapa('Baixando o motor do jogo…', 0, 35);
  fase = 'motor';
  let observador = null;
  try {
    observador = new PerformanceObserver((lista) => {
      for (const r of lista.getEntries()) {
        if (r.responseStatus >= 400) faltou = `${nomeCurto(r.name)} (${r.responseStatus})`;
        if (fase !== 'motor' || falhou || !/\.js(\?|$)/.test(r.name)) continue;
        motor++;
        pintar(1 - Math.exp(-motor / 18));
        $('.detalhe').textContent = `${motor} arquivos · ${nomeCurto(r.name)}`;
      }
    });
    observador.observe({ type: 'resource', buffered: true });
  } catch { /* sem Resource Timing: fica só o texto da etapa */ }

  // Erros enquanto a tela está aberta: script que não carregou (main.js ou
  // um import: o erro chega no <script> de entrada), erro de sintaxe, ou
  // promessa rejeitada sem tratamento. Depois de fechada, o jogo cuida.
  addEventListener('error', (e) => {
    if (!aberto) return;
    if (e.target instanceof HTMLScriptElement) {
      carga.erro(new Error(`não consegui baixar ${nomeCurto(e.target.src)} ou um dos módulos que ele usa`));
    } else if (e instanceof ErrorEvent) {
      carga.erro(new Error(`${e.message}${e.filename ? `\n${nomeCurto(e.filename)}:${e.lineno}` : ''}`));
    }
  }, true);
  addEventListener('unhandledrejection', (e) => { if (aberto) carga.erro(e.reason); });

  // Nada andou por um tempo: avisa que está lento (ou sem internet), sem desistir.
  const relogio = setInterval(() => {
    if (!aberto || falhou || janela.classList.contains('pronto')) return;
    const parado = (Date.now() - ultimo) / 1000;
    const aviso = $('.lenta');
    if (navigator.onLine === false) { aviso.hidden = false; aviso.textContent = 'Parece que a internet caiu. Esperando ela voltar…'; }
    else if (parado > 10) { aviso.hidden = false; aviso.textContent = `A conexão está lenta (${Math.round(parado)} s sem novidade). Continuo tentando…`; }
  }, 1000);
})();
</script>
<script type="module" src="./main.js?v=59"></script>
</body>
</html>
